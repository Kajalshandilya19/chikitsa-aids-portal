# Runs this service's pending migrations BEFORE a rollout. Images never migrate at boot (rule R-DB-6).
#   kubectl -n hiv-pension delete job pension-auth-service-migrate --ignore-not-found
#   kubectl apply -f kube-manifests/migration-job.yaml && kubectl -n hiv-pension wait --for=condition=complete job/pension-auth-service-migrate
apiVersion: batch/v1
kind: Job
metadata:
  name: pension-auth-service-migrate
  namespace: hiv-pension
  labels: { app: pension-auth-service, component: migration }
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  template:
    metadata:
      labels: { app: pension-auth-service, component: migration }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: migrate
          image: REGISTRY/pension-auth-service:TAG
          command: ["node", "dist/dev/migrate.js", "run"]
          envFrom:
            - secretRef: { name: pension-common }
            - secretRef: { name: pension-auth }
          env:
            - { name: NODE_ENV, value: "production" }
            - { name: DB_ALLOW_MIGRATIONS, value: "true" }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

# HIV Pension Portal: local infrastructure only (the services and the web app run on the host).
# Always start it through scripts/dev.sh, which loads env/local.env first.
#   postgres  Postgres 17, database hiv_pension, one login role per service (docker/postgres/10-bootstrap.sh)
#   redis     captcha nonces and rate-limit counters (shared by every service replica)
#   minio     private object storage: consent documents, import files, export files
# Every port is bound to 127.0.0.1. Nothing here is reachable from the network.
name: hiv-pension

services:
  postgres:
    image: postgres:17-alpine
    container_name: hiv-pension-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hiv_pension}
      POSTGRES_USER: ${DB_ADMIN_USER:-pension_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?run scripts/setup.sh first}
      AUTH_DB_USER: ${AUTH_DB_USER:-pension_auth_svc}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?run scripts/setup.sh first}
      CORE_DB_USER: ${CORE_DB_USER:-pension_core_svc}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?run scripts/setup.sh first}
      DATA_DB_USER: ${DATA_DB_USER:-pension_data_svc}
      DATA_DB_PASSWORD: ${DATA_DB_PASSWORD:?run scripts/setup.sh first}
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - hiv-pension-pg:/var/lib/postgresql/data
      - ./docker/postgres/10-bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: hiv-pension-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run scripts/setup.sh first}", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:latest
    container_name: hiv-pension-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pensionminio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?run scripts/setup.sh first}
    ports:
      - "127.0.0.1:${MINIO_PORT:-19010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19011}:9001"
    volumes:
      - hiv-pension-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  hiv-pension-pg:
  hiv-pension-minio:

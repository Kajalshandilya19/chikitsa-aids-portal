# EXAMPLE ONLY. Never commit real values. Create the real Secrets from the environment's secret store
# (docs/DEPLOYMENT.md §2). Every __VALUE__ must be replaced; scripts/setup.sh shows how each is generated.
#
# pension-common : read by all three services (and the web app reads the URLs + cookie settings)
# pension-auth   : auth-service DB login (+ the core/data role names it grants audit EXECUTE to)
# pension-core   : core-service DB login
# pension-data   : data-service DB login
apiVersion: v1
kind: Secret
metadata:
  name: pension-common
  namespace: hiv-pension
type: Opaque
stringData:
  APP_ENV: "uat"                       # uat | production. NEVER local in a cluster (S-CFG-5).
  LOG_LEVEL: "info"
  CORS_ORIGIN: "https://pension.example.gov.in"
  TRUST_PROXY_HOPS: "1"
  AUTH_SERVICE_URL: "http://pension-auth-service.hiv-pension.svc.cluster.local"
  CORE_SERVICE_URL: "http://pension-core-service.hiv-pension.svc.cluster.local"
  DATA_SERVICE_URL: "http://pension-data-service.hiv-pension.svc.cluster.local"
  DB_HOST: "__VALUE__"
  DB_PORT: "5432"
  DB_NAME: "hiv_pension"
  REDIS_HOST: "__VALUE__"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "__VALUE__"
  MINIO_ENDPOINT: "__VALUE__"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "true"
  MINIO_ACCESS_KEY: "__VALUE__"
  MINIO_SECRET_KEY: "__VALUE__"
  MINIO_BUCKET: "hiv-pension-private"
  JWT_SIGNING_KEY: "__VALUE__"         # >= 32 random chars
  JWT_ISSUER: "hiv-pension-auth"
  JWT_AUDIENCE: "hiv-pension"
  PII_ENCRYPTION_KEY: "__VALUE__"      # base64 of 32 random bytes. Losing it = losing every encrypted field.
  PII_HMAC_KEY: "__VALUE__"            # base64 of 32 random bytes
  ACCESS_TTL_MIN: "15"
  REFRESH_TTL_HOURS: "8"
  SESSION_IDLE_MIN: "30"
  MFA_ENFORCED: "true"
  SMS_PROVIDER: "esanchar"
  ESANCHAR_URL: "__VALUE__"
  IMPORT_MAX_FILE_MB: "10"
  IMPORT_MAX_ROWS: "100000"
  IMPORT_STAGE_RETENTION_DAYS: "7"
  SESSION_COOKIE_PREFIX: "hp"
  COOKIE_SECURE: "true"
  WEB_ORIGIN: "https://pension.example.gov.in"
---
apiVersion: v1
kind: Secret
metadata: { name: pension-auth, namespace: hiv-pension }
type: Opaque
stringData:
  AUTH_DB_USER: "pension_auth_svc"
  AUTH_DB_PASSWORD: "__VALUE__"
  CORE_DB_USER: "pension_core_svc"
  DATA_DB_USER: "pension_data_svc"
---
apiVersion: v1
kind: Secret
metadata: { name: pension-core, namespace: hiv-pension }
type: Opaque
stringData:
  CORE_DB_USER: "pension_core_svc"
  CORE_DB_PASSWORD: "__VALUE__"
---
apiVersion: v1
kind: Secret
metadata: { name: pension-data, namespace: hiv-pension }
type: Opaque
stringData:
  DATA_DB_USER: "pension_data_svc"
  DATA_DB_PASSWORD: "__VALUE__"
